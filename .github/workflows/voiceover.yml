name: Voiceover

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Hindi script text"
        required: true

jobs:
  voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install google-genai
        run: pip install "google-genai>=2.25.0"

      - name: Write script file
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
        run: printf '%s' "$SCRIPT_TEXT" > script.txt

      - name: Make voiceover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python voiceover.py

      - uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: voiceover.wav
